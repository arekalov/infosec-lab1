name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: SAST и SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'SAST: Semgrep'
        run: |
          set -o pipefail
          pipx install semgrep==1.179.0
          semgrep scan --config p/kotlin --config p/java --config p/secrets --error 2>&1 | tee semgrep-report.txt

      - name: 'SCA: Trivy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          format: table
          output: trivy-report.txt
          exit-code: '1'

      - name: Сводка отчётов
        if: always()
        run: |
          {
            echo '### SAST: Semgrep'
            echo '```'
            if grep -q 'Scan Summary' semgrep-report.txt 2>/dev/null; then
              sed -n '/Scan Summary/,$p' semgrep-report.txt
            elif [ -f semgrep-report.txt ]; then
              tail -n 15 semgrep-report.txt
            fi
            echo '```'
            echo '### SCA: Trivy'
            echo '```'
            if [ -f trivy-report.txt ]; then cat trivy-report.txt; fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            semgrep-report.txt
            trivy-report.txt
          retention-days: 30
