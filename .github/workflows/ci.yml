name: CI

# Проверки безопасности запускаются на каждый push в main и на каждый pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN получает только чтение кода.
permissions:
  contents: read

jobs:
  security:
    name: SAST и SCA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Все actions закреплены по SHA коммита, а не по подвижному тегу.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SAST: Semgrep проверяет исходники правилами для Kotlin и Java
      # и ищет захардкоженные секреты. Любая находка завершает job с ошибкой.
      # Версия зафиксирована, чтобы результат не менялся от прогона к прогону.
      - name: 'SAST: Semgrep'
        run: |
          set -o pipefail
          pipx install semgrep==1.179.0
          semgrep scan --config p/kotlin --config p/java --config p/secrets --error 2>&1 | tee semgrep-report.txt

      # SCA: Trivy сверяет зависимости из gradle.lockfile с базами уязвимостей.
      # Уязвимости уровня HIGH и CRITICAL завершают job с ошибкой.
      - name: 'SCA: Trivy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          format: table
          output: trivy-report.txt
          exit-code: '1'

      - name: Отчёт Trivy
        if: always()
        run: if [ -f trivy-report.txt ]; then cat trivy-report.txt; fi

      # Отчёты сохраняются даже при упавшей проверке: по ним видно, что нужно исправить.
      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            semgrep-report.txt
            trivy-report.txt
          retention-days: 30
