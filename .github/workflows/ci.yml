name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: SAST и SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 'SAST: SpotBugs + FindSecBugs'
        run: ./gradlew --no-daemon spotbugsMain

      - name: Snyk CLI
        if: ${{ !cancelled() }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1308.1

      - name: 'SCA: Snyk'
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/reports/snyk
          snyk test --configuration-matching='^runtimeClasspath$' --severity-threshold=high \
            --json-file-output=build/reports/snyk/snyk.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Сводка отчётов
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### SAST: SpotBugs + FindSecBugs'
            if [ -f build/reports/spotbugs/main.txt ]; then
              echo "Замечаний: $(grep -c . build/reports/spotbugs/main.txt || true)"
              echo '```'
              cat build/reports/spotbugs/main.txt
              echo '```'
            else
              echo 'Отчёт не сформирован'
            fi
            echo '### SCA: Snyk'
            report=build/reports/snyk/snyk.json
            if [ -f "$report" ]; then
              jq -r '
                if .error then "Ошибка Snyk: \(.error)" else
                  "- Проверено зависимостей: \(.dependencyCount)",
                  "- Уязвимостей уровня high и critical: \(.uniqueCount)",
                  (.vulnerabilities | unique_by(.id)[]
                    | "- \(.packageName)@\(.version): \(.id) (\(.severity))")
                end
              ' "$report" || echo 'Не удалось разобрать отчёт'
            else
              echo 'Отчёт не сформирован'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёты
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            build/reports/spotbugs/
            build/reports/snyk/
          retention-days: 30
