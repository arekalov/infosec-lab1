spring:
  application:
    name: recipe-api
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:file:./data/recipes;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: recipe-api
    ttl: 15m

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  level:
    ru.itmo.infosec.recipes: INFO
